  thumbnail: https://i3.ytimg.com/vi/r0q6_R_EoTA/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nS\xE9minaire du 20 novembre 2025 : Chiffrement
    totalement homomorphe CKKS\n\nIntervenant : Damien Stehl\xE9, CryptoLab\n\nLe
    chiffrement homomorphe CKKS (Cheon, Kim, Kim et Song, Asiacrypt 2017) permet de
    calculer sur des vecteurs de nombres complexes de grande dimension, sans les divulguer.
    Ses op\xE9rations \xE9l\xE9mentaires sont l'addition, la multiplication et la
    conjugaison coordonn\xE9e par coordonn\xE9e, ainsi que la rotation cyclique des
    coordonn\xE9es.\n\nNous pr\xE9senterons comment effectuer ces op\xE9rations, puis
    comment les utiliser pour \xE9valuer des polyn\xF4mes et multiplier une matrice
    par un vecteur. Avec ces outils \xE0 disposition, nous d\xE9crirons le \xAB bootstrap
    \xBB de CKKS, qui permet d'effectuer des calculs arbitraires. Enfin, nous \xE9voquerons
    des applications de CKKS, notamment en biom\xE9trie et en apprentissage automatique.\n\nRetrouvez
    les enregistrements audios et vid\xE9os du cycle et son texte de pr\xE9sentation
