- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (9) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/gzvhg3tteUU?version=3
  thumbnail: https://i4.ytimg.com/vi/gzvhg3tteUU/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nS\xE9minaire du 4 d\xE9cembre 2025 : Calcul
    s\xE9curis\xE9 et al\xE9a corr\xE9l\xE9, de la th\xE9orie \xE0 la pratique\n\nIntervenant
    : Geoffroy Couteau, CNRS\n\nDans cet expos\xE9, nous aborderons le calcul multipartite
    s\xE9curis\xE9 sous l'angle de son efficacit\xE9 concr\xE8te, et d\xE9taillerons
    le paradigme du calcul s\xE9curis\xE9 dans le mod\xE8le de l'al\xE9a corr\xE9l\xE9.
    Dans ce paradigme, les participants ont acc\xE8s \xE0 une source s\xE9curis\xE9e
    produisant de longues cha\xEEnes al\xE9atoires corr\xE9l\xE9es. Cette approche
    r\xE9duit la probl\xE9matique du calcul s\xE9curis\xE9 efficace \xE0 deux sous-questions
    : comment l'utilisation de longues cha\xEEnes al\xE9atoires corr\xE9l\xE9es peut-elle
    acc\xE9l\xE9rer les protocoles de calcul s\xE9curis\xE9 ? Comment g\xE9n\xE9rer
    efficacement et de fa\xE7on s\xFBre de longues cha\xEEnes al\xE9atoires corr\xE9l\xE9es
    ? Nous illustrerons tout d'abord la r\xE9ponse \xE0 la premi\xE8re question en
    partant d'un protocole de Beaver, et montrerons comment l'usage d'extension de
    transferts inconscients permet, \xE0 partir d'un simple g\xE9n\xE9rateur pseudo-al\xE9atoire,
    de r\xE9pondre \xE0 la seconde question dans le cadre du calcul de circuits bool\xE9ens
    avec s\xE9curit\xE9 passive. En fin d'expos\xE9, nous montrerons comment la notion
    r\xE9cente de g\xE9n\xE9rateurs de corr\xE9lations pseudo-al\xE9atoires permet
    de r\xE9aliser cette extension de transferts inconscients avec une communication
    minimale.\n\nRetrouvez les enregistrements audios et vid\xE9os du cycle et son
    texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/seminaire/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nChaire
