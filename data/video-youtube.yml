- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (12) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/qs64_yx3N2g?version=3
  thumbnail: https://i2.ytimg.com/vi/qs64_yx3N2g/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 18 d\xE9cembre 2025 : S\xE9curiser
    le calcul : nouvelles directions et conclusions\n\nProfesseur : Xavier Leroy\nChaire
    Sciences du logiciel\n\nLa premi\xE8re partie de ce cours a \xE9tudi\xE9 l'utilisation
    d'une m\xE9moire \xE0 acc\xE8s direct dans le cadre d'un calcul s\xE9curis\xE9,
    afin d'aller plus loin que les mod\xE8les de calcul \xE0 base de circuits bool\xE9ens
    ou arithm\xE9tiques utilis\xE9s dans les cours pr\xE9c\xE9dents. Le mod\xE8le
    de la m\xE9moire inconsciente (ORAM, Oblivious RAM) permet \xE0 un processeur
    s\xE9curis\xE9 d'acc\xE9der \xE0 une RAM externe sans que les donn\xE9es \xE9chang\xE9es
    ni les motifs d'acc\xE8s \xE0 la RAM ne r\xE9v\xE8lent quoi que ce soit sur le
    calcul r\xE9alis\xE9 par le processeur. Nous avons pr\xE9sent\xE9 la premi\xE8re
    r\xE9alisation de ce concept : l'algorithme \xAB square-root ORAM \xBB de Goldreich
    et Ostrovsky (1996). Nous avons ensuite envisag\xE9 le cas o\xF9 les adresses
    des acc\xE8s m\xE9moire sont produites par un circuit \xE9valu\xE9 de mani\xE8re
    homomorphe. Lin, Mook et Wichs (2023) ont appliqu\xE9 \xE0 ce sc\xE9nario leur
    approche \xAB DEPIR \xBB (Doubly-Efficient Private Information Retrieval), dans
    laquelle la m\xE9moire, repr\xE9sent\xE9e par un tableau multidimensionnel, est
    d'abord chiffr\xE9e avec un chiffrement faiblement homomorphe alg\xE9brique (contenu
    et adresses), puis repr\xE9sent\xE9e de mani\xE8re relativement compacte et avec
    des acc\xE8s en temps polylogarithmique \xE0 l'aide de la technique de factorisation
    rapide de polyn\xF4mes de Kedlaya et Umans (2008).\n\nLa deuxi\xE8me partie du
    cours \xE9tait consacr\xE9e \xE0 l'obfuscation de programmes : comment rendre
    le code d'un programme incompr\xE9hensible au point o\xF9 il ne fournit aucune
    information suppl\xE9mentaire par rapport \xE0 celles obtenues en ex\xE9cutant
    le programme. Des techniques peu s\xE9curis\xE9es d'obfuscation sont fr\xE9quemment
    utilis\xE9es pour compliquer la r\xE9tro-ing\xE9ni\xE9rie et le piratage de logiciels.
    De mani\xE8re beaucoup plus ambitieuse, une obfuscation de qualit\xE9 cryptographique
    telle que l'obfuscation indistinguable (IO, indistinguishability obfuscation,
    Barak et al, 2001) permettrait de r\xE9aliser facilement presque toutes les primitives
    cryptographiques connues, du chiffrement \xE0 cl\xE9 publique au chiffrement homomorphe
    et bien plus encore. Nous avons tent\xE9 d'expliquer l'extr\xEAme difficult\xE9
    de r\xE9alisation d'un obfuscateur indistinguable, avec plusieurs propositions
    utilisant des formes multilin\xE9aires qui se sont r\xE9v\xE9l\xE9es non s\xFBres,
    et une seule proposition (Jain, Lin et Sahai, 2021) qui r\xE9siste encore.\n\nRetrouvez
    les enregistrements audios et vid\xE9os du cycle et son texte de pr\xE9sentation
    :\nhttps://www.college-de-france.fr/fr/agenda/cours/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nRetrouvez
    tous les enseignements du Pr Xavier Leroy :\nhttps://www.college-de-france.fr/chaire/xavier-leroy-sciences-du-logiciel-chaire-statutaire\nhttps://www.youtube.com/playlist?list=PLtimy8tnozICbD45yhB7Ha_zIBJTIK3im\n\nLe
