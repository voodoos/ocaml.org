  thumbnail: https://i2.ytimg.com/vi/5LlPTF8iivE/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nS\xE9minaire du 11 d\xE9cembre 2025 : Des
    preuves zero-knowledge \xE0 l'anonymat en ligne\n\nIntervenant : Michele Orr\xF9,
    CNRS\n\nCet expos\xE9, en anglais, propose une introduction aux applications des
    preuves \xE0 divulgation nulle de connaissance (zero-knowledge) pour l\u2019anonymat
    en ligne.\nApr\xE8s avoir pr\xE9sent\xE9 les notions fondamentales de preuves
    et d\u2019arguments cryptographiques, nous montrons comment ces outils permettent
    de v\xE9rifier des propri\xE9t\xE9s ou des calculs sans r\xE9v\xE9ler d\u2019informations
    sensibles.\n\nLa seconde partie est consacr\xE9e \xE0 deux \xE9tudes de cas :
    les identit\xE9s et credentials anonymes, permettant une authentification respectant
    la vie priv\xE9e ; les paiements anonymes, permettant de cacher les montants et
    les liens entre transactions tout en conservant la s\xE9curit\xE9 du syst\xE8me.\n\nLa
    pr\xE9sentation met l\u2019accent sur les id\xE9es cryptographiques sous-jacentes
    et leurs implications pratiques pour la protection de la vie priv\xE9e dans les
    syst\xE8mes num\xE9riques modernes, en s\u2019appuyant sur les outils pr\xE9sent\xE9s
    pendant le reste du cours.\n\nRetrouvez les enregistrements audios et vid\xE9os
    du cycle et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/seminaire/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nChaire
