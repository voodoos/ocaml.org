  content: https://www.youtube.com/watch/E8sk7V--9cM?version=3
  thumbnail: https://i2.ytimg.com/vi/E8sk7V--9cM/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 11 d\xE9cembre 2025 : Preuves
    zero-knowledge\n\nProfesseur : Xavier Leroy\nChaire Sciences du logiciel\n\nUne
    preuve sans divulgation de connaissance, \xE9galement appel\xE9e preuve \xABzero-knowledge\xBB,
    est un protocole entre un prouveur, qui d\xE9tient un secret satisfaisant une
    certaine propri\xE9t\xE9, et une v\xE9rificatrice.  \xC0 l'issue de l'\xE9change,
    la v\xE9rificatrice est quasi certaine que le prouveur conna\xEEt le secret en
    question, mais n'a rien appris d'autre sur sa valeur.  Les preuves zero-knowledge
    ont de nombreuses applications, notamment dans le cadre des blockchains, pour
    par exemple affirmer des faits sur des donn\xE9es priv\xE9es (par exemple, garantir
    qu'un vote \xE9lectronique est bien form\xE9, sans r\xE9v\xE9ler le vote); autoriser
    des actions tout en pr\xE9servant l'anonymat de l'acteur; et d\xE9l\xE9guer des
    calculs tout en garantissant que le r\xE9sultat est correct.\n\nNous avons commenc\xE9
    ce cours par l'\xE9tude des protocoles Sigma, un patron de conception de protocoles
    zero-knowledge en trois interactions: mise en gage, d\xE9fi et r\xE9ponse.  Nous
    avons ensuite \xE9nonc\xE9 les propri\xE9t\xE9s de s\xE9curit\xE9 de ces protocoles
    (compl\xE9tude, correction sp\xE9ciale et non-divulgation) et les avons illustr\xE9es
    \xE0 l'aide du protocole de Schnorr (connaissance d'un logarithme discret) et
    de sa g\xE9n\xE9ralisation, le protocole de Maurer (connaissance d'un ant\xE9c\xE9dent
    par un morphisme).  Enfin, nous avons vu comment transformer un protocole Sigma
    interactif en protocole non-interactif \xE0 l'aide de l'heuristique de Fiat-Shamir.\n\nLa
    suite du cours a pr\xE9sent\xE9 une construction g\xE9n\xE9rique de \xABzk-SNARKs\xBB
    : des preuves zero knowledge, succintes (de petite taille) et non-interactives
    de la connaissance d'une valeur satisfaisant une propri\xE9t\xE9.  L'utilisation
    de circuits arithm\xE9tiques contraints permet d'exprimer de mani\xE8re concise
    un grand nombre de propri\xE9t\xE9s.  Nous avons vu comment repr\xE9senter ces
    circuits contraints sous forme d'\xE9quations polynomiales appel\xE9es QAP (Quadratic
    Arithmetic Programs).  Apr\xE8s un long d\xE9tour par la preuve de propri\xE9t\xE9s
    de divisibilit\xE9 de polyn\xF4mes et l'\xE9valuation homomorphe, chiffr\xE9e
    et authentifi\xE9e de polyn\xF4mes, nous avons d\xE9crit le protocole Pinocchio
    (Parno et al., 2016), qui construit des preuves zk-SNARK pour des propri\xE9t\xE9s
    QAP arbitraires.\n\nRetrouvez les enregistrements audios et vid\xE9os du cycle
    et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/cours/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nRetrouvez
