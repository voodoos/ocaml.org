  thumbnail: https://i2.ytimg.com/vi/mSe0MLruKGY/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 13 novembre 2025 : Chiffrement
    totalement homomorphe : calculer sur des donn\xE9es chiffr\xE9es (1)\n\nProfesseur
    : Xavier Leroy\nChaire Sciences du logiciel\n\nCe cours a commenc\xE9 par des
    rappels sur les algorithmes de chiffrement et la mani\xE8re de sp\xE9cifier et
    de d\xE9montrer leur s\xE9curit\xE9. Nous avons ensuite introduit la notion de
    chiffrement semi-homomorphe : les chiffrements qui sont homomorphes pour l'addition
    ou la multiplication de textes clairs mais pas pour les deux op\xE9rations. Nous
    en avons montr\xE9 quatre exemples : les chiffrements RSA, d'ElGamal, d'ElGamal
    exponentiel, et de Paillier. Mais l'objectif ultime est d'obtenir un chiffrement
    qui soit homomorphe pour l'addition et pour la multiplication, ce qui permettrait
    d'\xE9valuer de mani\xE8re homomorphe des circuits bool\xE9ens arbitraires, via
    un encodage des portes logiques par des polyn\xF4mes.\n\nComme premi\xE8re \xE9tape
    dans cette direction, nous avons introduit la notion de chiffrement faiblement
    homomorphe, c'est-\xE0-dire homomorphe pour un nombre limit\xE9 d'additions et
    de multiplications. Nous avons pr\xE9sent\xE9 la construction, due \xE0 van Dijk,
    Gentry, Halevy et Vaikuntanathan (2010), d'un tel chiffrement utilisant uniquement
    des nombres entiers. Ce chiffrement peut \xEAtre rendu totalement homomorphe en
    le combinant avec la proc\xE9dure de bootstrap introduite par Gentry en 2009.
    Cette proc\xE9dure repose sur l'\xE9valuation homomorphe d'un circuit qui r\xE9alise
    le d\xE9chiffrement. Elle permet de supprimer la limite sur le nombre d'additions
    et de multiplications successives, et donc d'\xE9valuer des circuits arbitraires,
    \xE0 condition que le circuit de d\xE9chiffrement soit suffisamment simple pour
    \xEAtre \xE9valu\xE9 par un chiffrement faiblement homomorphe, ce qui est difficile
    \xE0 r\xE9aliser.\n\nRetrouvez les enregistrements audios et vid\xE9os du cycle
    et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/cours/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nRetrouvez
    tous les enseignements du Pr Xavier Leroy :\nhttps://www.college-de-france.fr/chaire/xavier-leroy-sciences-du-logiciel-chaire-statutaire\nhttps://www.youtube.com/playlist?list=PLtimy8tnozICbD45yhB7Ha_zIBJTIK3im\n\nLe
    Coll\xE8ge de France est une institution de recherche fondamentale dans tous les
    domaines de la connaissance et un lieu de diffusion du \xAB savoir en train de
    se faire \xBB ouvert \xE0 tous.\nLes cours, s\xE9minaires, colloques sont enregistr\xE9s
    puis mis \xE0 disposition du public sur le site internet du Coll\xE8ge de France.\n\nD\xE9couvrez
    toutes les ressources du Coll\xE8ge de France : \nhttps://www.college-de-france.fr\n\nSoutenir
    le Coll\xE8ge de France :\nhttps://www.fondation-cdf.fr/faire-un-don\n\nSuivez-nous
    sur :\nThreads : https://www.threads.net/@collegedefrance\nBluesky : https://bsky.app/profile/college-de-france.fr\nFacebook
    : https://www.facebook.com/College.de.France\nInstagram : https://www.instagram.com/collegedefrance\nLinkedIn
    : https://fr.linkedin.com/company/coll%C3%A8gedefrance"
