- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (6) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/F2nXjLkJ4G4?version=3
  thumbnail: https://i3.ytimg.com/vi/F2nXjLkJ4G4/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 27 novembre 2025 : Calcul multipartite
    s\xE9curis\xE9 : partager des secrets\n\nProfesseur : Xavier Leroy\nChaire Sciences
    du logiciel\n\nCe cours est le premier d'une s\xE9rie de deux cours consacr\xE9s
    au calcul multipartite s\xE9curis\xE9 (en anglais : Multi-Party Computation, MPC),
    un mode de calcul s\xE9curis\xE9 dans lequel plusieurs participants coop\xE8rent
    pour calculer une fonction de leurs donn\xE9es priv\xE9es, sans jamais les r\xE9v\xE9ler
    aux autres participants. \xC0 la diff\xE9rence de l'approche du chiffrement homomorphe
    \xE9tudi\xE9e dans les deux cours pr\xE9c\xE9dents, l'approche multipartite s\xE9curis\xE9e
    repose sur des algorithmes distribu\xE9s mettant en \u0153uvre des protocoles
    interactifs.\n\nNous avons \xE9tudi\xE9 plusieurs sch\xE9mas de partage de donn\xE9es
    secr\xE8tes entre plusieurs participants : le sch\xE9ma GMW (Goldreich-Micali-Wigderson)
    pour partager des bits entre deux participants ; le partage additif complet, qui
    g\xE9n\xE9ralise GMW \xE0 un nombre quelconque de participants ; le partage r\xE9pliqu\xE9
    \xAB deux parmi trois \xBB, qui r\xE9siste \xE0 la panne d'un des participants
    au prix d'un doublement de la taille des donn\xE9es ; et enfin le partage de Shamir,
    qui r\xE9siste \xE0 la panne de plusieurs participants et permet \xE9galement
    de d\xE9tecter voire de corriger les erreurs commises par certains participants.
    Ces diff\xE9rents sch\xE9mas sont des instances d'une classe g\xE9n\xE9rale de
    partages lin\xE9aires de secrets (Linear Secret Sharing Scheme, LSSS) qui s'expriment
    \xE9l\xE9gamment en termes d'alg\xE8bre lin\xE9aire.\n\nPour ces diff\xE9rents
    sch\xE9mas, nous avons vu comment partager un secret en plusieurs parts (une par
    participant), comment r\xE9v\xE9ler un secret partag\xE9, et comment effectuer
    des op\xE9rations arithm\xE9tiques ou logiques sur les secrets partag\xE9s de
    mani\xE8re distribu\xE9e. Si les op\xE9rations lin\xE9aires (addition, multiplication
    par une constante) sont simples et peuvent \xEAtre effectu\xE9es de mani\xE8re
    locale par chaque participant, la multiplication de deux secrets partag\xE9s est
    plus complexe et n\xE9cessite un \xE9change d'informations entre les participants.\n\nEnfin,
    nous avons \xE9tudi\xE9 la s\xE9curit\xE9 passive ou active de ces sch\xE9mas
    de partage de secrets, c'est-\xE0-dire leur capacit\xE9 \xE0 r\xE9sister \xE0
    des attaques men\xE9es par un participant malveillant ou une collusion de plusieurs
    participants malveillants. En particulier, les capacit\xE9s de d\xE9tection et
    de correction d'erreurs des codes de Reed-Solomon sur lesquels repose le partage
    de Shamir permettent, sous certaines hypoth\xE8ses, de se pr\xE9munir contre des
    attaques actives o\xF9 les participants malveillants ne suivent pas le protocole
    et injectent des valeurs incorrectes dans le calcul.\n\nRetrouvez les enregistrements
    audios et vid\xE9os du cycle et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/cours/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nRetrouvez
