- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (4) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/C9BSbS0CUtw?version=3
  thumbnail: https://i4.ytimg.com/vi/C9BSbS0CUtw/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 20 novembre 2026 : Chiffrement
    totalement homomorphe : calculer sur des donn\xE9es chiffr\xE9es (2)\n\nProfesseur
    : Xavier Leroy\nChaire Sciences du logiciel\n\nCe cours a poursuivi l'\xE9tude
    du chiffrement totalement homomorphe entam\xE9e au cours pr\xE9c\xE9dent. Apr\xE8s
    un rappel de l'approche introduite par Gentry en 2009, qui combine chiffrement
    faiblement homomorphe et proc\xE9dure de bootstrap, nous avons \xE9tudi\xE9 trois
    directions pour rendre cette approche plus utilisable.\n\nLa premi\xE8re direction
    est l'utilisation de chiffrements faiblement homomorphes qui reposent sur le probl\xE8me
    LWE (Learning With Errors) et ses variantes RLWE et GLWE. Le probl\xE8me LWE,
    introduit par Regev en 2005, est une g\xE9n\xE9ralisation du probl\xE8me LPN (Learning
    Parity with Noise), bien connu en th\xE9orie du codage et en th\xE9orie de l'apprentissage
    statistique, ainsi que du probl\xE8me CVP (Closest Vector Problem) sur les r\xE9seaux
    euclidiens. LWE permet de construire des sch\xE9mas de chiffrement \xE9l\xE9gants,
    post-quantiques, et faiblement homomorphes pour l'addition et la multiplication
    par une constante.\n\nLa deuxi\xE8me direction consiste \xE0 am\xE9liorer l'op\xE9ration
    de multiplication homomorphe pour qu'elle introduise moins de bruit dans les r\xE9sultats.
    Nous avons d\xE9taill\xE9 l'approche BGV propos\xE9e par Brakerski, Gentry, et
    Vaikuntanathan en 2012, qui effectue une \xE9tape de r\xE9duction de module apr\xE8s
    chaque multiplication, afin de garder le bruit quasi-constant en valeur absolue.
    Cela augmente consid\xE9rablement la profondeur multiplicative des circuits qui
    peuvent \xEAtre \xE9valu\xE9s homomorphiquement sans recours \xE0 un bootstrap.\n\nLa
    troisi\xE8me direction vise \xE0 rendre la proc\xE9dure de bootstrap moins co\xFBteuse.
    Nous avons \xE9tudi\xE9 l'approche FHEW/TFHE propos\xE9e par Chillotti, Gama,
    Georgieva et Izabach\xE8ne en 2016, qui repose sur un acc\xE8s index\xE9 homomorphe
    dans une table de constantes calcul\xE9es et chiffr\xE9es \xE0 l'avance. Combin\xE9e
    avec un changement de cl\xE9 et un changement de module, cette approche \xE0 base
    de tables d\xE9bouche sur un bootstrap programmable, qui non seulement r\xE9duit
    le bruit mais aussi calcule de mani\xE8re homomorphe une fonction des textes clairs
    dans les textes clairs.\n\nRetrouvez les enregistrements audios et vid\xE9os du
    cycle et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/cours/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nRetrouvez
