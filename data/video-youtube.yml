- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (12) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/p7BFV2ap4LI?version=3
  thumbnail: https://i1.ytimg.com/vi/p7BFV2ap4LI/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nS\xE9minaire du 18 d\xE9cembre 2025 : Le
    chiffrement fonctionnel : agr\xE9ger des donn\xE9es sensibles\n\nIntervenant :
    David Pointcheval, Cosmian\n\nLe chiffrement fonctionnel (FE, Functional Encryption)
    est la primitive cryptographique la plus r\xE9cente propos\xE9e par la communaut\xE9
    cryptographique pour r\xE9pondre aux besoins de confidentialit\xE9 lors de calculs
    sur les donn\xE9es sensibles. Contrairement au chiffrement totalement homomorphe
    (FHE, Fully Homomorphic Encryption), le FE permet au calculateur sur les entr\xE9es
    chiffr\xE9es d\u2019obtenir directement l\u2019\xE9valuation d\u2019une fonction
    en clair, et les fonctions accessibles restent sous le contr\xF4le du ou des propri\xE9taires
    des donn\xE9es. Contrairement au calcul multipartite s\xE9curis\xE9, aucune interaction
    n\u2019est n\xE9cessaire entre les diff\xE9rentes parties, permettant ainsi des
    calculs totalement asynchrones.\n\nDans cet expos\xE9, nous pr\xE9senterons tout
    d\u2019abord l\u2019origine de cette primitive, avec le chiffrement fonctionnel
    \xAB mono-utilisateur \xBB, o\xF9 les donn\xE9es d\u2019une seule entit\xE9 sont
    chiffr\xE9es. Quelques exemples illustreront les int\xE9r\xEAts du FE, mais aussi
    ses limites, ainsi que les limites inh\xE9rentes aux calculs s\xE9curis\xE9s en
    g\xE9n\xE9ral. Ensuite, nous verrons certaines extensions, dont le chiffrement
    fonctionnel multi-client qui permet \xE0 plusieurs entit\xE9s, qui ne se font
    nullement confiance, de mettre des donn\xE9es sensibles en commun pour autoriser
    des agr\xE9gations (et notamment des sommes partielles ou des moyennes pond\xE9r\xE9es).\n\nNous
    conclurons avec des applications \xE0 l\u2019apprentissage automatique, et en
    particulier \xE0 la classification confidentielle. Nous verrons alors \xE0 quel
    point il est important d\u2019identifier pr\xE9cis\xE9ment ce qu\u2019on attend
    comme r\xE9sultat d'un calcul confidentiel, mais surtout ce que l\u2019on souhaite
    prot\xE9ger.\n\nRetrouvez les enregistrements audios et vid\xE9os du cycle et
    son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/seminaire/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nChaire
    Sciences du logiciel\nProfesseur : Xavier Leroy\n\nRetrouvez tous les enseignements
