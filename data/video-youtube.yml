  content: https://www.youtube.com/watch/vXrpJXM7dkY?version=3
  thumbnail: https://i3.ytimg.com/vi/vXrpJXM7dkY/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nS\xE9minaire du 13 novembre 2025 : Outils
    cryptographiques pour le vote \xE9lectronique\n\nIntervenant : Pierrick Gaudry,
    CNRS\n\nLe vote par Internet est un exemple o\xF9 la cryptographie avanc\xE9e
    est requise, et d\xE9ploy\xE9e en pratique, afin de garantir de bonnes propri\xE9t\xE9s
    de s\xE9curit\xE9. Dans cet expos\xE9, nous pr\xE9senterons ce contexte du vote
    \xE9lectronique, ainsi que le protocole de vote Belenios (simplifi\xE9), afin
    d'illustrer les besoins en preuves zero-knowledge (ZKP).\n\nEnsuite, nous d\xE9crirons
    le fonctionnement de ces ZKP utiles au vote, en partant des plus basiques, pour
    aller progressivement vers des constructions complexes qui rel\xE8vent plut\xF4t
    du calcul multipartite. Nous expliquerons comment ceci permet d'aller plus loin
    que le vote classique en termes de secret du vote, gr\xE2ce \xE0 la notion de
    d\xE9pouillement en aveugle (tally-hiding).\n\nRetrouvez les enregistrements audios
    et vid\xE9os du cycle et son texte de pr\xE9sentation :\nhttps://www.college-de-france.fr/fr/agenda/seminaire/le-calcul-securise-calculer-sur-des-donnees-chiffrees-ou-privees\n\nChaire
