- title: "Le calcul s\xE9curis\xE9 : calculer sur des donn\xE9es chiffr\xE9es ou priv\xE9es
    (1) - Xavier Leroy (2025-2026)"
  content: https://www.youtube.com/watch/psQC-8i6XrE?version=3
  thumbnail: https://i1.ytimg.com/vi/psQC-8i6XrE/hqdefault.jpg
  description: "Enseignement 2025-2026 : Le calcul s\xE9curis\xE9 : calculer sur des
    donn\xE9es chiffr\xE9es ou priv\xE9es\nCours du 6 novembre 2025 : S\xE9curiser
    le calcul : introduction et \xE9tude de cas\n\nProfesseur : Xavier Leroy\nChaire
    Sciences du logiciel\n\nCe premier cours sur le calcul s\xE9curis\xE9 a introduit
    deux approches pour calculer sur des donn\xE9es priv\xE9es sans les r\xE9v\xE9ler
    aux op\xE9rateurs du calcul : le chiffrement homomorphe, qui permet d'effectuer
    certains calculs sur des donn\xE9es chiffr\xE9es et de produire des r\xE9sultats
    \xE9galement chiffr\xE9s, sans donner les cl\xE9s de d\xE9chiffrement au calculateur
    ; et le calcul multipartite s\xE9curis\xE9, dans lequel plusieurs participants
    coop\xE8rent pour calculer une fonction de leurs donn\xE9es priv\xE9es, sans jamais
    r\xE9v\xE9ler ces donn\xE9es aux autres participants. Ces deux approches seront
    \xE9tudi\xE9es de mani\xE8re plus approfondie dans la suite du cours.\n\nPour
    compl\xE9ter ce premier cours, nous avons \xE9tudi\xE9 trois exemples d'utilisation
    de ces techniques. La premi\xE8re \xE9tude de cas est le calcul multipartite d'une
    moyenne, permettant par exemple \xE0 un groupe d'amis de d\xE9terminer leur salaire
    moyen sans que chacun r\xE9v\xE8le son salaire aux autres. La deuxi\xE8me \xE9tude
    de cas porte sur le d\xE9pouillement d'un vote \xE9lectronique simplifi\xE9, utilisant
    du chiffrement homomorphe pour totaliser les votes sans avoir \xE0 d\xE9chiffrer
    les bulletins individuellement, ainsi que des preuves \xE0 divulgation nulle de
    connaissance pour garantir que les votes sont bien form\xE9s sans avoir \xE0 les
    divulguer. La troisi\xE8me \xE9tude de cas concerne le calcul bipartite de l'intersection
    de deux ensembles priv\xE9s, un algorithme qui permet par exemple de d\xE9couvrir
    des contacts sur un r\xE9seau social sans r\xE9v\xE9ler de donn\xE9es personnelles.\n\nRetrouvez
    les enregistrements audios et vid\xE9os du cycle et son texte de pr\xE9sentation
